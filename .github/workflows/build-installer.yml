name: Build installer

on:
  workflow_dispatch: {}
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish src/WinFileRecovery.App/WinFileRecovery.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      # Signs WinFileRecovery.exe with an Authenticode certificate, but only
      # once a real one is configured — this is a no-op until then, so it's
      # safe to leave enabled rather than a checklist item someone forgets.
      # Set up (once a cert is purchased): add repo secrets
      # WINFILERECOVERY_PFX_BASE64 (the .pfx, base64-encoded) and
      # WINFILERECOVERY_PFX_PASSWORD, then this step does the rest.
      - name: Sign application executable
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        env:
          HAS_SIGNING_CERT: ${{ secrets.WINFILERECOVERY_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String("${{ secrets.WINFILERECOVERY_PFX_BASE64 }}"))
          $exePath = "src\WinFileRecovery.App\bin\Release\net8.0-windows\win-x64\publish\WinFileRecovery.exe"
          & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\x64\signtool.exe" sign `
            /f $pfxPath /p "${{ secrets.WINFILERECOVERY_PFX_PASSWORD }}" `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            $exePath
          Remove-Item $pfxPath

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss

      - name: Sign installer
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        env:
          HAS_SIGNING_CERT: ${{ secrets.WINFILERECOVERY_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String("${{ secrets.WINFILERECOVERY_PFX_BASE64 }}"))
          Get-ChildItem installer\Output\*.exe | ForEach-Object {
            & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\x64\signtool.exe" sign `
              /f $pfxPath /p "${{ secrets.WINFILERECOVERY_PFX_PASSWORD }}" `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              $_.FullName
          }
          Remove-Item $pfxPath

      - name: Compute SHA-256 of installer
        shell: pwsh
        run: |
          Get-ChildItem installer\Output\*.exe | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)" | Out-File installer\Output\SHA256SUMS.txt -Append -Encoding ascii
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinFileRecovery-Setup
          path: |
            installer/Output/*.exe
            installer/Output/SHA256SUMS.txt

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
