name: Tests

on:
  workflow_dispatch: {}
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run unit + fuzz-smoke tests
        run: dotnet test tests/WinFileRecovery.Core.Tests/WinFileRecovery.Core.Tests.csproj -c Release --logger "console;verbosity=normal"
